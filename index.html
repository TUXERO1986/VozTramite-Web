<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VozTrámite — Maqueta de trámites por voz</title>
  <meta name="description" content="Prototipo de interfaz de trámites estatales peruanos guiada por voz. Trabajo académico de HCI/UX, no es un servicio oficial." />
  <link rel="icon" href="favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/layout.css" />
</head>
<body>
  <a class="skip-link" href="#main-content">Ir al asistente</a>

  <div id="app-root" aria-live="off"></div>

  <!-- Regiones globales de anuncio (4.1.3). Las pantallas las rellenan vía VT.anunciar(). -->
  <div id="vt-live-polite" class="visually-hidden" aria-live="polite" role="status"></div>
  <div id="vt-live-alert" class="visually-hidden" aria-live="assertive" role="alert"></div>

  <!-- Núcleo: sin módulos ES para que index.html funcione abierto con doble clic (file://) -->
  <script>window.VT = window.VT || {}; window.VT.screens = window.VT.screens || {};</script>
  <script src="js/icons.js"></script>
  <script src="js/data.js"></script>
  <script src="js/voice.js"></script>
  <script src="js/connectivity.js"></script>
  <script src="js/a11y.js"></script>
  <script src="js/ui.js"></script>

  <!-- Pantallas: cada archivo se registra en window.VT.screens -->
  <script src="js/screens/m01.js"></script>
  <script src="js/screens/m02.js"></script>
  <script src="js/screens/m03.js"></script>
  <script src="js/screens/m04.js"></script>
  <script src="js/screens/m05.js"></script>
  <script src="js/screens/m06.js"></script>
  <script src="js/screens/m07.js"></script>
  <script src="js/screens/m08.js"></script>
  <script src="js/screens/m09.js"></script>
  <script src="js/screens/m10.js"></script>
  <script src="js/screens/m11.js"></script>
  <script src="js/screens/m12.js"></script>
  <script src="js/screens/m13.js"></script>
  <script src="js/screens/m14.js"></script>
  <script src="js/screens/m15.js"></script>
  <script src="js/screens/m16.js"></script>
  <script src="js/screens/m17.js"></script>
  <script src="js/screens/d01.js"></script>
  <script src="js/screens/d02.js"></script>
  <script src="js/screens/d03.js"></script>
  <script src="js/screens/d04.js"></script>
  <script src="js/screens/d05.js"></script>
  <script src="js/screens/d06.js"></script>
  <script src="js/screens/d07.js"></script>
  <script src="js/screens/d08.js"></script>
  <script src="js/screens/d09.js"></script>
  <script src="js/screens/componentes.js"></script>

  <!-- Router + estado global: arranca en DOMContentLoaded, cuando ya registraron todas las pantallas -->
  <script src="js/app.js"></script>
</body>
</html>
